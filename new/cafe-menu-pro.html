<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منوی کافه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fafaf9; --card:#ffffff; --border:#e9e6e1; --text:#211d1a; --muted:#97918a;
  --accent:#a4764e; --accent-soft:#f4ede5; --like:#3f9142; --dislike:#d04545;
  --radius:16px; --shadow:0 1px 3px rgba(35,28,22,.05);
}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}

/* ---- هدر مینیمال ---- */
header{position:sticky;top:0;z-index:20;background:rgba(250,250,249,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.header-inner{max-width:880px;margin:auto;padding:18px 20px;display:flex;align-items:center;gap:14px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:21px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:.2s}
.logo:active{transform:scale(.92)}
.header-text h1{font-size:19px;font-weight:900;letter-spacing:-.3px}
.header-text p{font-size:12px;color:var(--muted);margin-top:2px;font-weight:300}
.admin-pill{display:none;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:3px 10px}
body.admin .admin-pill{display:inline-block}

/* ---- نوار ابزار ---- */
.toolbar{max-width:880px;margin:20px auto 0;padding:0 20px}
.search{width:100%;padding:12px 18px;border:1px solid var(--border);border-radius:14px;font-family:inherit;font-size:14px;background:#fff;outline:none;transition:.2s;color:var(--text)}
.search::placeholder{color:var(--muted)}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 2px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--border);background:#fff;color:var(--muted);padding:7px 16px;border-radius:30px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:.2s}
.tab:hover{border-color:var(--accent);color:var(--text)}
.tab.active{background:var(--text);border-color:var(--text);color:#fff}

/* ---- گرید آیتم‌ها ---- */
main{max-width:880px;margin:18px auto 80px;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;animation:up .3s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.photo{aspect-ratio:4/3;background:#f1ede7;display:flex;align-items:center;justify-content:center;font-size:54px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:7px;flex:1}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card-top h3{font-size:16px;font-weight:700}
.price{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.ing{font-size:13px;color:var(--muted);line-height:1.9;font-weight:300}
.actions{display:flex;align-items:center;gap:4px;margin-top:auto;padding-top:10px;border-top:1px solid var(--border)}
.act{border:none;background:none;font-family:inherit;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;padding:7px 12px;border-radius:10px;transition:.15s}
.act:hover{background:var(--accent-soft);color:var(--text)}
.act.like.on{color:var(--like);font-weight:700}
.act.dislike.on{color:var(--dislike);font-weight:700}
.act.cmt.on{color:var(--accent);font-weight:700}
.admin-bar{display:none;gap:6px;margin-top:8px}
body.admin .admin-bar{display:flex}
.mini{flex:1;border:1px solid var(--border);border-radius:10px;padding:7px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;background:#fff;color:var(--muted);transition:.15s}
.mini:hover{border-color:var(--text);color:var(--text)}
.mini.del:hover{border-color:var(--dislike);color:var(--dislike)}

/* ---- نظرات ---- */
.comments{display:none;border-top:1px solid var(--border);margin-top:4px;padding-top:12px;flex-direction:column;gap:12px}
.comments.open{display:flex}
.cmt-item{padding-bottom:10px;border-bottom:1px solid var(--border)}
.cmt-item:last-of-type{border-bottom:none}
.cmt-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.cmt-name{font-size:12px;font-weight:700}
.cmt-acts{display:flex;gap:2px}
.cmt-like,.cmt-dislike{border:none;background:none;font-family:inherit;font-size:11px;cursor:pointer;color:var(--muted);padding:3px 8px;border-radius:8px;transition:.15s}
.cmt-like.on{color:var(--like);font-weight:700}
.cmt-dislike.on{color:var(--dislike);font-weight:700}
.cmt-del{color:var(--dislike);font-size:11px;border:none;background:none;cursor:pointer;font-family:inherit}
.cmt-text{font-size:13px;line-height:1.9;color:#4a453f;font-weight:300}
.cmt-form{display:flex;flex-direction:column;gap:8px}
.cmt-form input,.cmt-form textarea{border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-family:inherit;font-size:13px;outline:none;resize:vertical;background:#fff}
.cmt-form input:focus,.cmt-form textarea:focus{border-color:var(--accent)}
.btn-dark{border:none;background:var(--text);color:#fff;border-radius:10px;padding:10px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:.2s}
.btn-dark:hover{opacity:.85}
.hint{font-size:11px;color:var(--muted);line-height:1.8;font-weight:300}

.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:70px 0;font-size:14px;font-weight:300}

/* ---- دکمه شناور مدیریت ---- */
.fab{position:fixed;bottom:22px;left:22px;z-index:30;background:var(--text);color:#fff;border:none;border-radius:50px;padding:14px 24px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.18);display:none;align-items:center;gap:8px}
.fab:hover{opacity:.9}
body.admin .fab{display:flex}
.fab2{left:22px;bottom:86px}

/* ---- مودال ---- */
.overlay{position:fixed;inset:0;background:rgba(30,24,18,.45);backdrop-filter:blur(4px);z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:20px;width:100%;max-width:440px;max-height:92vh;overflow-y:auto;padding:24px;animation:up .25s ease}
.modal h2{font-size:16px;font-weight:900;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#5b544c}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-family:inherit;font-size:14px;outline:none;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.img-preview{margin-top:8px;border-radius:12px;max-height:150px;width:100%;object-fit:cover;display:none}
.modal-actions{display:flex;gap:10px;margin-top:4px}
.modal-actions button{flex:1;padding:11px}
.btn-line{border:1px solid var(--border);background:#fff;color:var(--muted);border-radius:10px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer}
.btn-line:hover{border-color:var(--text);color:var(--text)}
.cat-row{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.cat-row span{flex:1}
footer{max-width:880px;margin:auto;padding:24px 20px 40px;text-align:center;color:var(--muted);font-size:11px;font-weight:300}
@media(max-width:480px){main{grid-template-columns:1fr}.header-text h1{font-size:17px}}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo" id="logo" title="">☕</div>
    <div class="header-text">
      <h1><span id="cafeName">کافه دنج</span> <span class="admin-pill">مدیریت</span></h1>
      <p id="subTitle">منوی دیجیتال</p>
    </div>
  </div>
</header>

<div class="toolbar">
  <input class="search" id="search" type="text" placeholder="جستجو در منو">
  <div class="tabs" id="tabs"></div>
</div>

<button class="fab" id="addBtn">＋ افزودن آیتم</button>
<button class="fab fab2" id="catBtn">🗂 دسته‌بندی‌ها</button>

<main id="grid"></main>

<!-- مودال افزودن / ویرایش آیتم -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">افزودن آیتم جدید</h2>
    <form id="itemForm">
      <div class="field"><label>نام آیتم *</label><input id="fName" required placeholder="مثلاً: کاپوچینو"></div>
      <div class="field"><label>قیمت (تومان) *</label><input id="fPrice" type="number" min="0" required placeholder="65000"></div>
      <div class="field"><label>دسته‌بندی *</label><select id="fCat"></select></div>
      <div class="field" id="newCatField" hidden><label>نام دسته جدید</label><input id="fNewCat" placeholder="مثلاً: اسموتی"></div>
      <div class="field"><label>ترکیبات و توضیحات *</label>
        <textarea id="fIng" rows="3" required placeholder="مثلاً: اسپرسو دبل، شیر تازه، کف شیر، پودر دارچین"></textarea>
      </div>
      <div class="field"><label>عکس آیتم</label>
        <input id="fPhoto" type="file" accept="image/*">
        <img class="img-preview" id="photoPreview" alt="">
        <p class="hint">عکس به‌صورت خودکار فشرده می‌شود تا منو سریع لود شود.</p>
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn-dark">ذخیره</button>
        <button type="button" class="btn-line" id="cancelBtn">انصراف</button>
      </div>
    </form>
  </div>
</div>

<!-- مودال مدیریت دسته‌ها -->
<div class="overlay" id="catOverlay">
  <div class="modal">
    <h2>مدیریت دسته‌بندی‌ها</h2>
    <div id="catList"></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <input id="fAddCat" placeholder="نام دسته جدید..." style="flex:1;border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-family:inherit;font-size:14px;outline:none">
      <button class="btn-dark" id="addCatBtn" style="padding:10px 18px">افزودن</button>
    </div>
    <div class="modal-actions" style="margin-top:14px">
      <button type="button" class="btn-line" id="catCloseBtn">بستن</button>
    </div>
  </div>
</div>

<footer>با ❤️ ساخته شد</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============================================================
   ⚙️ تنظیمات — این بخش را ویرایش کنید
   ============================================================ */
/* رمز مدیریت (حتماً عوضش کنید) */
const ADMIN_PASS = '1234';

/* 👇 تنظیمات Firebase خود را اینجا بچسبانید (Project settings ← Your apps ← CDN) */
const firebaseConfig = {
  apiKey: "PASTE_HERE",
  authDomain: "PASTE_HERE",
  databaseURL: "PASTE_HERE",
  projectId: "PASTE_HERE",
  storageBucket: "PASTE_HERE",
  messagingSenderId: "PASTE_HERE",
  appId: "PASTE_HERE"
};
const PREFIX = 'cafemenu'; // مسیر داده‌ها در دیتابیس (می‌توانید عوض کنید)
const useFirebase = firebaseConfig.apiKey !== 'PASTE_HERE';
if (useFirebase) firebase.initializeApp(firebaseConfig);
const db = useFirebase ? firebase.database() : null;

/* شناسه یکتا برای هر دستگاه (جلوگیری از رأی چندباره) */
let voterId = localStorage.getItem('cafe_voter');
if (!voterId) { voterId = 'v' + Date.now() + Math.random().toString(36).slice(2, 8); localStorage.setItem('cafe_voter', voterId); }

/* ---------- وضعیت ---------- */
const DEFAULT_CATS = ['قهوه گرم', 'نوشیدنی سرد', 'دسر', 'صبحانه'];
let LOCAL = null;
let items = {}, comments = {}, votes = {}, cvotes = {};
let categories = [...DEFAULT_CATS];
let cafeName = 'کافه دنج';
let admin = sessionStorage.getItem('cafe_admin') === '1';
let activeCat = 'همه', keyword = '', editingId = null, tempPhoto = '';

function defaultItems() {
  return {
    d1: { name: 'اسپرسو', price: 45000, cat: 'قهوه گرم', emoji: '☕', photo: '', ing: 'اسپرسوی تلخ و غلیظ با کرمای طلایی، از دانه ۱۰۰٪ عربیکای تازه‌برشت' },
    d2: { name: 'کاپوچینو', price: 65000, cat: 'قهوه گرم', emoji: '🍮', photo: '', ing: 'اسپرسو دبل، شیر بخارداده و کف نرم، تاپینگ پودر دارچین' },
    d3: { name: 'کولد برو', price: 75000, cat: 'نوشیدنی سرد', emoji: '🧊', photo: '', ing: 'قهوه دم‌سرد ۱۸ ساعته با یخ؛ طعمی شیرین‌تر و کم‌اسید' },
    d4: { name: 'چیزکیک نیویورکی', price: 85000, cat: 'دسر', emoji: '🍰', photo: '', ing: 'کرم‌پنیری ابریشمی روی بیسکویت کره‌ای با سس توت‌فرنگی' }
  };
}

/* ---------- ذخیره‌سازی (Firebase یا حافظه محلی) ---------- */
function write(path, val) {
  if (useFirebase) { db.ref(path).set(val); return; }
  const parts = path.replace(PREFIX + '/', '').split('/');
  let node = LOCAL;
  for (let i = 0; i < parts.length - 1; i++) node = node[parts[i]] = node[parts[i]] || {};
  if (val === null) delete node[parts[parts.length - 1]]; else node[parts[parts.length - 1]] = val;
  try { localStorage.setItem('lc_' + PREFIX, JSON.stringify(LOCAL)); } catch (e) { alert('حافظه پر شده!'); }
  render();
}

function applyState(s) {
  items = s.items || {}; comments = s.comments || {};
  votes = s.votes || {}; cvotes = s.cvotes || {};
  categories = (s.meta && s.meta.categories) || [...DEFAULT_CATS];
  cafeName = (s.meta && s.meta.cafeName) || 'کافه دنج';
  document.getElementById('cafeName').textContent = cafeName;
  document.title = 'منوی ' + cafeName;
}

function bindLocal() {
  LOCAL = { items: defaultItems(), comments: {}, votes: {}, cvotes: {}, meta: { cafeName: 'کافه دنج', categories: [...DEFAULT_CATS] } };
  try {
    const saved = JSON.parse(localStorage.getItem('lc_' + PREFIX) || 'null');
    if (saved) LOCAL = saved;
  } catch (e) {}
  applyState(LOCAL);
}

function bindFirebase() {
  db.ref(PREFIX).on('value', s => {
    applyState(s.val() || {});
    try { localStorage.setItem('lc_' + PREFIX, JSON.stringify(s.val() || {})); } catch (e) {}
    render(); renderTabs();
  });
}

/* ---------- ابزارها ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Number(n || 0).toLocaleString('en-US');
const countVotes = map => { let l = 0, d = 0; for (const k in map) { if (map[k] === 'like') l++; else if (map[k] === 'dislike') d++; } return [l, d]; };

/* ---------- رندر ---------- */
const grid = document.getElementById('grid'), tabsEl = document.getElementById('tabs');

function renderTabs() {
  const cats = ['همه', ...categories];
  tabsEl.innerHTML = cats.map(c => `<button class="tab ${c === activeCat ? 'active' : ''}" onclick="setCat('${esc(c)}')">${esc(c)}</button>`).join('');
  if (!cats.includes(activeCat)) { activeCat = 'همه'; renderTabs(); }
}
function setCat(c) { activeCat = c; renderTabs(); render(); }

function render() {
  const kw = keyword.trim();
  const list = Object.entries(items).filter(([, it]) =>
    (activeCat === 'همه' || it.cat === activeCat) && (!kw || it.name.includes(kw) || (it.ing || '').includes(kw)));
  if (!list.length) { grid.innerHTML = '<div class="empty">چیزی پیدا نشد</div>'; return; }
  grid.innerHTML = list.map(([id, it]) => {
    const [lk, dl] = countVotes(votes[id]);
    const cmts = Object.entries(comments).filter(([, c]) => c.itemId === id);
    return `<article class="card">
      <div class="photo">${it.photo ? `<img src="${it.photo}" alt="" loading="lazy">` : esc(it.emoji || '🍽️')}</div>
      <div class="card-body">
        <div class="card-top"><h3>${esc(it.name)}</h3><span class="price">${fmt(it.price)} تومان</span></div>
        <p class="ing">${esc(it.ing)}</p>
        <div class="actions">
          <button class="act like ${votes[id] && votes[id][voterId] === 'like' ? 'on' : ''}" onclick="voteItem('${id}','like')">👍 ${lk}</button>
          <button class="act dislike ${votes[id] && votes[id][voterId] === 'dislike' ? 'on' : ''}" onclick="voteItem('${id}','dislike')">👎 ${dl}</button>
          <button class="act cmt" onclick="toggleCmt('${id}')">💬 ${cmts.length} نظر</button>
        </div>
        <div class="admin-bar">
          <button class="mini" onclick="openEdit('${id}')">✏️ ویرایش</button>
          <button class="mini del" onclick="delItem('${id}')">🗑️ حذف</button>
        </div>
        <div class="comments" id="c-${id}">
          ${cmts.map(([cid, c]) => {
            const [cl, cd] = countVotes(cvotes[cid]);
            return `<div class="cmt-item">
              <div class="cmt-head"><span class="cmt-name">${esc(c.name)}</span>
                <span class="cmt-acts">
                  <button class="cmt-like ${cvotes[cid] && cvotes[cid][voterId] === 'like' ? 'on' : ''}" onclick="voteCmt('${cid}','like')">👍 ${cl}</button>
                  <button class="cmt-dislike ${cvotes[cid] && cvotes[cid][voterId] === 'dislike' ? 'on' : ''}" onclick="voteCmt('${cid}','dislike')">👎 ${cd}</button>
                  ${admin ? `<button class="cmt-del" onclick="delCmt('${cid}')">حذف</button>` : ''}
                </span></div>
              <p class="cmt-text">${esc(c.text)}</p>
            </div>`;
          }).join('') || '<p class="hint">هنوز نظری ثبت نشده.</p>'}
          <div class="cmt-form">
            <input id="n-${id}" placeholder="نام شما (اختیاری)">
            <textarea id="t-${id}" rows="2" placeholder="نظرت را بنویس..."></textarea>
            <button class="btn-dark" onclick="addCmt('${id}')">ارسال نظر</button>
          </div>
        </div>
      </div>
    </article>`;
  }).join('');
}
/* ---------- رأی محصول ---------- */
function voteItem(id, type) {
  const map = Object.assign({}, votes[id]);
  if (map[voterId] === type) delete map[voterId]; else map[voterId] = type;
  write(PREFIX + '/votes/' + id, map);
}

/* ---------- نظرات ---------- */
function toggleCmt(id) { document.getElementById('c-' + id).classList.toggle('open'); }
function addCmt(itemId) {
  const n = document.getElementById('n-' + itemId).value.trim() || 'مهمان';
  const t = document.getElementById('t-' + itemId).value.trim();
  if (!t) { alert('لطفاً متن نظر را بنویسید'); return; }
  const cid = 'c' + Date.now();
  write(PREFIX + '/comments/' + cid, { itemId, name: n, text: t });
}
function voteCmt(cid, type) {
  const map = Object.assign({}, cvotes[cid]);
  if (map[voterId] === type) delete map[voterId]; else map[voterId] = type;
  write(PREFIX + '/cvotes/' + cid, map);
}
function delCmt(cid) { if (confirm('این نظر حذف شود؟')) write(PREFIX + '/comments/' + cid, null); }

/* ---------- ورود مخفی مدیریت: ۵ بار کلیک روی لوگو ---------- */
let taps = 0, tapTimer;
document.getElementById('logo').addEventListener('click', () => {
  taps++; clearTimeout(tapTimer);
  tapTimer = setTimeout(() => taps = 0, 2500);
  if (taps >= 5) {
    taps = 0;
    if (admin) {
      if (confirm('خروج از حالت مدیریت؟')) { admin = false; sessionStorage.removeItem('cafe_admin'); syncAdminUI(); }
    } else {
      const p = prompt('رمز مدیریت:');
      if (p === ADMIN_PASS) { admin = true; sessionStorage.setItem('cafe_admin', '1'); syncAdminUI(); }
      else if (p !== null) alert('رمز اشتباه است');
    }
  }
});
function syncAdminUI() { document.body.classList.toggle('admin', admin); }

/* ویرایش نام کافه در حالت مدیریت (دابل‌کلیک روی اسم) */
document.getElementById('cafeName').addEventListener('dblclick', () => {
  if (!admin) return;
  const n = prompt('نام کافه:', cafeName);
  if (n && n.trim()) write(PREFIX + '/meta/cafeName', n.trim());
});

/* ---------- مودال آیتم ---------- */
const overlay = document.getElementById('overlay'), form = document.getElementById('itemForm');

function fillCatSelect() {
  const sel = document.getElementById('fCat');
  sel.innerHTML = categories.map(c => `<option>${esc(c)}</option>`).join('') + '<option value="__new">＋ دسته جدید...</option>';
}
document.getElementById('fCat').addEventListener('change', e => {
  document.getElementById('newCatField').hidden = e.target.value !== '__new';
});

document.getElementById('addBtn').onclick = () => {
  editingId = null; tempPhoto = ''; form.reset();
  fillCatSelect();
  document.getElementById('newCatField').hidden = true;
  document.getElementById('photoPreview').style.display = 'none';
  document.getElementById('modalTitle').textContent = 'افزودن آیتم جدید';
  overlay.classList.add('show');
};
document.getElementById('cancelBtn').onclick = () => overlay.classList.remove('show');
overlay.onclick = e => { if (e.target === overlay) overlay.classList.remove('show'); };

function openEdit(id) {
  const it = items[id]; if (!it) return;
  editingId = id; tempPhoto = it.photo || '';
  fillCatSelect();
  document.getElementById('fName').value = it.name;
  document.getElementById('fPrice').value = it.price;
  document.getElementById('fCat').value = it.cat;
  document.getElementById('fIng').value = it.ing;
  document.getElementById('newCatField').hidden = true;
  const pv = document.getElementById('photoPreview');
  if (it.photo) { pv.src = it.photo; pv.style.display = 'block'; } else pv.style.display = 'none';
  document.getElementById('modalTitle').textContent = 'ویرایش «' + it.name + '»';
  overlay.classList.add('show');
}

function delItem(id) {
  if (!confirm('این آیتم و نظراتش حذف شود؟')) return;
  write(PREFIX + '/items/' + id, null);
  Object.entries(comments).forEach(([cid, c]) => { if (c.itemId === id) write(PREFIX + '/comments/' + cid, null); });
  write(PREFIX + '/votes/' + id, null);
}

/* فشرده‌سازی عکس قبل از ذخیره */
document.getElementById('fPhoto').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const max = 900, scale = Math.min(1, max / Math.max(img.width, img.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    tempPhoto = cv.toDataURL('image/jpeg', 0.72);
    const pv = document.getElementById('photoPreview');
    pv.src = tempPhoto; pv.style.display = 'block';
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
});

form.onsubmit = e => {
  e.preventDefault();
  let cat = document.getElementById('fCat').value;
  if (cat === '__new') {
    cat = document.getElementById('fNewCat').value.trim();
    if (!cat) { alert('نام دسته جدید را بنویسید'); return; }
    if (!categories.includes(cat)) { categories.push(cat); write(PREFIX + '/meta/categories', categories); }
  }
  const data = {
    name: document.getElementById('fName').value.trim(),
    price: Number(document.getElementById('fPrice').value),
    cat, ing: document.getElementById('fIng').value.trim(),
    photo: tempPhoto, emoji: editingId ? (items[editingId].emoji || '🍽️') : '🍽️'
  };
  write(PREFIX + '/items/' + (editingId || 'i' + Date.now()), data);
  overlay.classList.remove('show');
};

/* ---------- مدیریت دسته‌بندی‌ها ---------- */
const catOverlay = document.getElementById('catOverlay');
document.getElementById('catBtn').onclick = () => { renderCatList(); catOverlay.classList.add('show'); };
document.getElementById('catCloseBtn').onclick = () => catOverlay.classList.remove('show');
catOverlay.onclick = e => { if (e.target === catOverlay) catOverlay.classList.remove('show'); };

function renderCatList() {
  document.getElementById('catList').innerHTML = categories.map(c => {
    const n = Object.values(items).filter(i => i.cat === c).length;
    return `<div class="cat-row"><span>${esc(c)} <small style="color:var(--muted)">(${n} آیتم)</small></span>
      <button class="mini del" style="flex:0 0 auto;padding:5px 12px" onclick="delCat('${esc(c)}')">حذف</button></div>`;
  }).join('');
}
function delCat(c) {
  const n = Object.values(items).filter(i => i.cat === c).length;
  if (n > 0) { alert('این دسته ' + n + ' آیتم دارد؛ اول آیتم‌ها را جابه‌جا یا حذف کنید.'); return; }
  if (!confirm('دسته «' + c + '» حذف شود؟')) return;
  categories = categories.filter(x => x !== c);
  write(PREFIX + '/meta/categories', categories);
  renderCatList(); renderTabs();
}
document.getElementById('addCatBtn').onclick = () => {
  const c = document.getElementById('fAddCat').value.trim();
  if (!c) return;
  if (categories.includes(c)) { alert('این دسته وجود دارد'); return; }
  categories.push(c);
  write(PREFIX + '/meta/categories', categories);
  document.getElementById('fAddCat').value = '';
  renderCatList(); renderTabs();
};

/* ---------- جستجو و شروع ---------- */
document.getElementById('search').addEventListener('input', e => { keyword = e.target.value; render(); });

if (useFirebase) bindFirebase(); else bindLocal();
renderTabs(); render(); syncAdminUI();
if (!useFirebase) console.warn('⚠️ Firebase تنظیم نشده — داده‌ها فقط روی همین دستگاه ذخیره می‌شوند.');
</script>
</body>
